name: Publish

# Publishes the official plugin repository (its plugins are third-party:
# hosted in plugins/, later also registered in registry/):
# - a GitHub Release per new plugin version: tag <id>-v<version>, asset
#   <id>-<version>.vxp, with a build provenance attestation;
# - GitHub Pages: index.json, index.json.sig and assets/<id>/<version>/
#   (README, changelog, icon).
# The repository must be public: Releases downloads and Pages of a private
# repository need authentication or a paid plan.
#
#   plugins ─▶ static ─┬─▶ plugin × N ─┬─▶ build ─▶ release-and-sign ─┬─▶ attest
#                      └───────────────┘                              └─▶ deploy
#
# First the same reusable checks as ci.yml (_static.yml, _plugin.yml for
# every plugin), without the npm cache (a release does not trust a cache
# that other branches could have written).
#
# Why build and signing are separate jobs (ecosystem plan 1.6 item 2):
# - `build` runs code from plugins: npm ci, the plugin builds (a plugin's
#   own npm dependencies install with --ignore-scripts and are bundled; see
#   scripts/lib/dependencies.mjs), and later the source builds of
#   third-party plugins registered in registry/. It gets no secret and no write token, so a malicious build
#   script can neither read the signing key nor publish anything. Its output
#   is data only: the unsigned index.json, the Pages assets and the new .vxp
#   packages.
# - `release-and-sign` holds the signing key (environment plugins-index). It
#   never runs plugin code or npm ci: it checks out only this repository's
#   scripts, keys/ and revoked.json, treats the build artifact as untrusted
#   data, checks each package's and store asset's sha256 and size against
#   the index, the version history, `revoked` (append-only) and `generated`
#   (previous + 1) against the previously signed index, and only then
#   creates the Releases and signs index.json.
# - `attest` signs a SLSA build provenance statement for each new .vxp
#   (Sigstore, through the job's OIDC token). It runs no repository code;
#   it is the only job with id-token: write and attestations: write besides
#   deploy's Pages token.
# - `deploy` puts the signed site on Pages (environment github-pages).
#
# A version whose Release already exists is never rebuilt; earlier versions
# come from the published, signed index.json.

on:
  push:
    branches: [main]
  workflow_dispatch:

# One publish at a time: each run builds on the index the previous run
# published.
concurrency:
  group: publish
  cancel-in-progress: false

permissions: {}

jobs:
  plugins:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      plugins: ${{ steps.plugins.outputs.plugins }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"
      - id: plugins
        run: node scripts/ci-plugins.mjs --all

  static:
    permissions:
      contents: read
    uses: ./.github/workflows/_static.yml
    with:
      cache: false

  plugin:
    needs: [plugins, static]
    strategy:
      fail-fast: false
      matrix:
        plugin: ${{ fromJSON(needs.plugins.outputs.plugins) }}
    permissions:
      contents: read
    uses: ./.github/workflows/_plugin.yml
    with:
      plugin: ${{ matrix.plugin }}
      cache: false

  build:
    needs: [static, plugin]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"
      # Before any plugin code runs in this job: the only step with a token
      # (read-only), and it reads manifest.json files only.
      - name: Query existing releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/query-releases.mjs "$RUNNER_TEMP/releases.json"
      - run: npm ci
      - run: npm run registry
      # Packs every plugin whose version has no Release yet with
      # scripts/plugin.mjs pack (a plugin's npm dependencies are checked,
      # installed with --ignore-scripts and checked again first);
      # third-party source builds will run here too, each isolated.
      - name: Build index.json and new packages
        run: >-
          node scripts/build-index.mjs
          --out "$RUNNER_TEMP/publish"
          --releases "$RUNNER_TEMP/releases.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: publish
          path: ${{ runner.temp }}/publish
          if-no-files-found: error
          retention-days: 7

  release-and-sign:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: plugins-index
    permissions:
      contents: write # gh release create
    steps:
      # The repository's own scripts only (plus root files such as
      # revoked.json); no plugins/, no node_modules, no npm ci. The scripts
      # use Node built-ins only.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            scripts
            keys
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: publish
          path: ${{ runner.temp }}/publish
      - name: Check the artifact and create the Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/publish-releases.mjs "$RUNNER_TEMP/publish" --target "$GITHUB_SHA"
      # One signature per key: VESTRA_INDEX_SIGNING_KEY, plus
      # VESTRA_INDEX_SIGNING_KEY_NEXT during a key rotation (CONTRIBUTING.md, "Key
      # rotation"; an unset secret is empty and ignored). Each key must belong
      # to one of keys/*.pub.pem.
      - name: Sign index.json
        env:
          VESTRA_INDEX_SIGNING_KEY: ${{ secrets.VESTRA_INDEX_SIGNING_KEY }}
          VESTRA_INDEX_SIGNING_KEY_NEXT: ${{ secrets.VESTRA_INDEX_SIGNING_KEY_NEXT }}
        run: |
          keys=()
          for key in keys/*.pub.pem; do keys+=(--public-key "$key"); done
          node scripts/sign-index.mjs "$RUNNER_TEMP/publish/site" "${keys[@]}"
      - name: Verify the signature
        run: |
          for key in keys/*.pub.pem; do
            node scripts/verify-index.mjs "$key" "$RUNNER_TEMP/publish/site" || echo "::warning::index.json is not signed with $key"
          done
          node scripts/verify-index.mjs keys/*.pub.pem "$RUNNER_TEMP/publish/site"
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ${{ runner.temp }}/publish/site

  # The packages are the build job's artifact, the same bytes that
  # release-and-sign checked against the index and released.
  attest:
    needs: release-and-sign
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      id-token: write # Sigstore signing certificate
      attestations: write # store the attestation
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: publish
          path: ${{ runner.temp }}/publish
      - id: packages
        run: |
          shopt -s nullglob
          packages=("$RUNNER_TEMP"/publish/releases/*.vxp)
          echo "count=${#packages[@]}" >> "$GITHUB_OUTPUT"
          printf '%s\n' "${packages[@]}"
      - if: steps.packages.outputs.count != '0'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ runner.temp }}/publish/releases/*.vxp

  deploy:
    needs: release-and-sign
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
