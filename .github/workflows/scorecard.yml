name: Scorecard

# OpenSSF Scorecard (weekly and on main): checks the repository's supply
# chain practices (pinned actions, token permissions, branch protection,
# code review, dangerous workflows, signed releases, …). Findings go to code
# scanning (Security tab); the result is also published to the OpenSSF API
# (publish_results), which needs the job's OIDC token and imposes the
# action's workflow restrictions: no top-level env or defaults, no run
# steps, only checkout, upload-artifact, upload-sarif and the action itself.

on:
  push:
    branches: [main]
  schedule:
    - cron: "23 5 * * 1" # Mondays 05:23 UTC
  workflow_dispatch:

permissions: {}

jobs:
  analysis:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write # upload the results to code scanning
      id-token: write # publish_results: sign the result for the OpenSSF API
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: results.sarif
          category: scorecard
