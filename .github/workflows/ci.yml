name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: ["22.18", "24"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      # Type checks every plugin (a plugin with its own package.json gets its
      # dependencies from its lock file), then the whole repository at once.
      - run: npm run check
      - run: npm run format:check
      - run: npm run boundaries
      - run: npm run portability
      - run: npm run build
      - run: npm test
