name: CI

# Orchestration only; the checks are in the reusable _*.yml workflows.
#
#   changes ─────────────────────┐
#                                ▼
#   static ──┬──────────▶ plugin × N ──┬──▶ ci-ok
#            └──▶ index-dryrun ────────┤
#   dependency-review (pull requests) ─┘
#
# `ci-ok` is the one required check: it fails when any job failed or was
# cancelled; a skipped job (no plugin changed) counts as passed. Pull
# requests from forks run here without secrets (pull_request, never
# pull_request_target).

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions: {}

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  # Keep every run on main; newer pushes replace older runs elsewhere.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      plugins: ${{ steps.plugins.outputs.plugins }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"
      # Every plugin on a manual run and on main; otherwise those changed
      # against the pull request's base or the commit before the push.
      - id: plugins
        env:
          ALL: ${{ github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [[ "$ALL" == true ]]; then
            node scripts/ci-plugins.mjs --all
          else
            node scripts/ci-plugins.mjs --base "$BASE"
          fi

  static:
    permissions:
      contents: read
    uses: ./.github/workflows/_static.yml

  plugin:
    needs: [changes, static]
    if: needs.changes.outputs.plugins != '[]'
    strategy:
      fail-fast: false
      matrix:
        plugin: ${{ fromJSON(needs.changes.outputs.plugins) }}
    permissions:
      contents: read
    uses: ./.github/workflows/_plugin.yml
    with:
      plugin: ${{ matrix.plugin }}

  index-dryrun:
    needs: static
    permissions:
      contents: read
    uses: ./.github/workflows/_index-dryrun.yml

  # New or updated npm packages in a pull request (any package.json or
  # lockfile, the plugins' and the repository's): fails on a known
  # vulnerability of high or critical severity and on a license outside the
  # list in scripts/lib/dependencies.mjs (which also enforces it, with the
  # lockfile's license field; this check uses GitHub's license data). Needs
  # the dependency graph (on by default for public repositories). The
  # summary is in the job summary, not a comment (fork pull requests get a
  # read-only token).
  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          # scripts/lib/dependencies.mjs ALLOWED_LICENSES; keep in step.
          allow-licenses: MIT, MIT-0, ISC, 0BSD, BSD-2-Clause, BSD-3-Clause, Apache-2.0, Zlib, BlueOak-1.0.0, BSL-1.0, CC0-1.0, Unlicense
          comment-summary-in-pr: never

  ci-ok:
    if: always()
    needs: [changes, static, plugin, index-dryrun, dependency-review]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "results: $RESULTS"
          for result in $RESULTS; do
            if [[ "$result" == failure || "$result" == cancelled ]]; then
              exit 1
            fi
          done
