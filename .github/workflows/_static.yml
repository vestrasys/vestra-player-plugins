name: Static checks

# Reusable (ci.yml, publish.yml). Everything that does not need a plugin
# build, on one Ubuntu runner; the plugin matrix starts only when this
# passes. No secrets, read-only token.

on:
  workflow_call:
    inputs:
      cache:
        description: Use the npm cache (publish.yml passes false).
        type: boolean
        default: true

permissions: {}

jobs:
  repository:
    name: repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The base commit's revoked.json for the append-only check below.
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"
          cache: ${{ inputs.cache && 'npm' || '' }}
      - run: npm ci
      # Each plugin's own npm dependencies (lockfile, --ignore-scripts, the
      # rules in scripts/lib/dependencies.mjs), so that tsc resolves them.
      - name: Plugin npm dependencies
        run: node scripts/plugin-deps.mjs install --all
      # The whole repository at once; each plugin's own strict check runs in
      # _plugin.yml.
      - name: tsc
        run: npx tsc --noEmit
      - run: npm run format:check
      - run: npm run boundaries
      - run: npm run portability
      # Registry format, revoked.json, and revoked.json append-only against
      # the pull request's base (or the commit before a push; none for a new
      # branch or a manual run). The authoritative append-only checks are in
      # publish.yml (release-and-sign, against the signed index) and
      # registry.yml (the base branch's script); this one reports it early.
      - name: npm run registry
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [[ -z "$BASE" || "$BASE" =~ ^0+$ ]] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            npm run registry
          else
            npm run registry -- --revoked-base "$BASE"
          fi
      # Tests of the repository scripts: index build, signing, registry.
      - run: npm run test:scripts

  # The plugin risk rules (.semgrep/plugin-risk.yml) against their samples:
  # every rule fires on the bad sample (semgrep --test checks each `ruleid:`
  # line) and nothing fires on the good one. The pull request scan itself
  # is security-scan.yml.
  semgrep-rules:
    name: semgrep rules
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      # semgrep CE (LGPL-2.1), the CLI only: no account, no registry rules.
      # The same image as security-scan.yml.
      SEMGREP: semgrep/semgrep:1.183.0@sha256:2e45517a85e13a9cca14a2a00df6bb48affd66b8ebfae1b0991cd57578362fb0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: The rules fire on the bad sample
        run: >-
          docker run --rm --network none -v "$GITHUB_WORKSPACE:/src:ro" -w /src "$SEMGREP"
          semgrep --test --metrics=off --disable-version-check
          --config .semgrep/plugin-risk.yml .semgrep/tests/plugin-risk/bad.ts
      - name: The rules stay quiet on the good sample
        run: >-
          docker run --rm --network none -v "$GITHUB_WORKSPACE:/src:ro" -w /src "$SEMGREP"
          semgrep scan --metrics=off --disable-version-check --disable-nosem --error
          --config .semgrep/plugin-risk.yml .semgrep/tests/plugin-risk/good.ts

  # Known vulnerabilities and malicious packages (OSV, which includes the
  # OpenSSF malicious-packages feed) in every lockfile: the repository's
  # and each plugin's. Fails on any match, whatever the severity (publish.yml
  # runs this too, so nothing known to be vulnerable is released); a
  # reviewed exception goes into the root osv-scanner.toml (passed with
  # --config, so it covers every lockfile) with a reason and an expiry date.
  osv-scanner:
    name: osv-scanner
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: osv-scanner
        uses: docker://ghcr.io/google/osv-scanner@sha256:4f3b7e2c64b9d38a5febc5a7e4a3dfef1d1362f726dea7a2ef4762b46469fcd0 # v2.7.0
        with:
          args: scan source --config osv-scanner.toml --lockfile package-lock.json --recursive plugins

  typos:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: crate-ci/typos@4c8b7f51ca60df14e3c5ca82770dfbbe6c3dae85 # v1.52.0

  workflows:
    name: actionlint + zizmor
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The image includes shellcheck for the run: scripts.
      - name: actionlint
        uses: docker://rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 # 1.7.12
        with:
          args: -color
      - name: zizmor
        uses: zizmorcore/zizmor-action@45d7276c9ca790aabd705e31ca99c6185c3e76dd # v0.8.1
        with:
          # Print the findings and fail on them; no code scanning upload
          # (that would need security-events: write).
          advanced-security: false
          persona: regular
          # The zizmor release itself, not the action's default "latest".
          version: 1.31.1
