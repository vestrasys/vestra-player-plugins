name: Registry owners

# The owner rule for registry/<id>.toml (CONTRIBUTING.md): a new registration
# lists the pull request author as an owner; a change to or removal of an
# existing one comes from one of its owners on the base branch. Also checks
# that revoked.json is append-only against the base branch.
#
# pull_request_target runs this workflow and scripts/check-registry.mjs as
# they are on the base branch, so a pull request cannot change the check
# that judges it. The pull request's files are read as data (git show); none
# of its code runs, and the job has a read-only token and no secrets.

on:
  # zizmor: ignore[dangerous-triggers] the pull request's code is never
  # checked out or run (see above); only its files are read with git show.
  pull_request_target:
    paths:
      - "registry/**"
      - "revoked.json"

permissions: {}

concurrency:
  group: registry-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  owners:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"
      - name: Fetch the pull request head (as data)
        env:
          NUMBER: ${{ github.event.pull_request.number }}
        run: git fetch --no-tags "https://github.com/$GITHUB_REPOSITORY.git" "refs/pull/$NUMBER/head:refs/remotes/pr/head"
      - name: Check registry owners and revoked.json
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
        run: node scripts/check-registry.mjs --base "$BASE" --head refs/remotes/pr/head --author "$AUTHOR"
